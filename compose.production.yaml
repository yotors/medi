name: medi-production
x-logs: &logs
  driver: local
  options: { max-size: 10m, max-file: '3' }
x-private: &private
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  secrets:
    <<: *private
    image: ${MEDI_API_IMAGE:?Set reviewed immutable API image}
    user: '0:0'
    command: [node, deploy/secrets-init.mjs]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    environment: { MEDI_PROVISION_ALERTS: '1' }
    network_mode: none
    logging: *logs
    volumes:
      [
        '${MEDI_SECRETS_FILE:?Supply private secret file}:/input/secrets.json:ro',
        'api-secrets:/api',
        'owner-secrets:/owner',
        'database-secrets:/database',
        './private/alertmanager.yaml:/input/alertmanager.yaml:ro',
        'alert-secrets:/alerts',
      ]
  database:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    logging: { driver: none }
    command:
      [
        postgres,
        -c,
        log_statement=none,
        -c,
        log_min_error_statement=panic,
        -c,
        log_parameter_max_length=0,
        -c,
        log_parameter_max_length_on_error=0,
        -c,
        logging_collector=off,
      ]
    environment:
      {
        POSTGRES_USER: medi_migrator,
        POSTGRES_DB: product_studio_release,
        POSTGRES_PASSWORD_FILE: /run/secrets/password,
      }
    volumes: ['database:/var/lib/postgresql/data', 'database-secrets:/run/secrets:ro']
    depends_on: { secrets: { condition: service_completed_successfully } }
    networks: [data]
    restart: unless-stopped
    healthcheck:
      {
        test: [CMD-SHELL, 'pg_isready -U medi_migrator -d product_studio_release'],
        interval: 5s,
        timeout: 5s,
        retries: 30,
      }
  migrate:
    <<: *private
    image: ${MEDI_API_IMAGE}
    command: [node, deploy/migrate.mjs]
    logging: *logs
    volumes: ['owner-secrets:/run/secrets:ro']
    environment:
      {
        DATABASE_URL_FILE: /run/secrets/database-url,
        MEDI_RUNTIME_PASSWORD_FILE: /run/secrets/runtime-password,
        STAFF_MFA_KEYRING_FILE: /run/secrets/mfa-keyring.json,
      }
    depends_on: { database: { condition: service_healthy } }
    networks: [data]
  api:
    <<: *private
    user: '1000:1000'
    image: ${MEDI_API_IMAGE}
    logging: *logs
    volumes: ['api-secrets:/run/secrets:ro']
    environment:
      {
        DATABASE_URL_FILE: /run/secrets/database-url,
        APP_ORIGIN: 'https://${MEDI_DOMAIN:?Set hospital domain}',
        MEDI_TELEMETRY: private,
        NODE_ENV: production,
        STAFF_MFA_POLICY: required,
        STAFF_MFA_KEYRING_FILE: /run/secrets/mfa-keyring.json,
        HOST: 0.0.0.0,
        PORT: '3100',
        TRUST_PROXY_HOPS: '1',
      }
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [data, edge]
    init: true
    stop_grace_period: 25s
    restart: unless-stopped
    healthcheck:
      {
        test:
          [
            CMD,
            node,
            -e,
            "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
          ],
        interval: 5s,
        timeout: 5s,
        retries: 15,
      }
  web:
    <<: *private
    image: ${MEDI_WEB_IMAGE:?Set reviewed immutable web image}
    logging: *logs
    cap_add: [NET_BIND_SERVICE]
    ports: ['80:80', '443:443']
    environment:
      {
        MEDI_DOMAIN: '${MEDI_DOMAIN}',
        MEDI_TLS_EMAIL: '${MEDI_TLS_EMAIL:?Set certificate contact}',
      }
    volumes:
      [
        './deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro',
        'certificates:/data',
        'web-config:/config',
      ]
    tmpfs: [/tmp]
    depends_on: { api: { condition: service_healthy } }
    networks: [edge]
    restart: unless-stopped
  collector-storage:
    image: ${MEDI_API_IMAGE}
    user: '0:0'
    command:
      [
        node,
        -e,
        "require('fs').chownSync('/data',10001,10001);require('fs').chmodSync('/data',0o700)",
      ]
    volumes: ['traces:/data']
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    logging: *logs
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
    command: [--config=/etc/otelcol/config.yaml]
    volumes: ['./deploy/observability/collector.yaml:/etc/otelcol/config.yaml:ro', 'traces:/data']
    depends_on:
      collector-storage: { condition: service_completed_successfully }
    networks: [data]
    mem_limit: 128m
    logging: *logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    command:
      [
        --config.file=/etc/prometheus/prometheus.yaml,
        --storage.tsdb.retention.time=24h,
        --storage.tsdb.retention.size=128MB,
      ]
    volumes:
      [
        './deploy/observability/prometheus.production.yaml:/etc/prometheus/prometheus.yaml:ro',
        './deploy/observability/rules.yaml:/etc/prometheus/rules.yaml:ro',
      ]
    tmpfs: ['/prometheus:uid=65534,gid=65534,mode=0700,size=160m']
    networks: [data]
    mem_limit: 256m
    logging: *logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command: [--config.file=/etc/alertmanager/config.yaml, --cluster.listen-address=]
    volumes: ['alert-secrets:/etc/alertmanager:ro']
    depends_on: { secrets: { condition: service_completed_successfully } }
    tmpfs: ['/alertmanager:uid=65534,gid=65534,mode=0700,size=16m']
    networks: [data, notifications]
    mem_limit: 64m
    logging: *logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  probe:
    <<: *private
    image: ${MEDI_API_IMAGE}
    command: [node, /probe.mjs]
    volumes: ['./deploy/observability/probe.mjs:/probe.mjs:ro']
    networks: [data]
    mem_limit: 64m
    logging: *logs
    restart: unless-stopped

networks: { data: { internal: true }, edge: {}, notifications: {} }
volumes:
  {
    database: {},
    api-secrets: {},
    owner-secrets: {},
    database-secrets: {},
    certificates: {},
    web-config: {},
    traces: {},
    alert-secrets: {},
  }
