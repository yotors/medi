global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: medi
    static_configs:
      - targets: ['collector:8889']
  - job_name: readiness
    static_configs:
      - targets: ['probe:9094']
