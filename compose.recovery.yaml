# All names/credentials/images supplied by validated recovery code. No source mounts/ports.
services:
  database:
    image: ${RECOVERY_DATABASE_IMAGE:?}
    pull_policy: never
    environment:
      POSTGRES_USER: medi_migrator
      POSTGRES_PASSWORD: ${MEDI_MIGRATION_PASSWORD:?}
      POSTGRES_DB: product_studio_release
    volumes: [recovery-database:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U medi_migrator -d product_studio_release']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: ${RECOVERY_API_IMAGE:?}
    pull_policy: never
    environment:
      DATABASE_URL: postgresql://medi_migrator:${MEDI_MIGRATION_PASSWORD}@database:5432/product_studio_release
      MEDI_RUNTIME_PASSWORD: ${MEDI_RUNTIME_PASSWORD:?}
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    image: ${RECOVERY_API_IMAGE:?}
    pull_policy: never
    environment:
      DATABASE_URL: postgresql://medi_runtime:${MEDI_RUNTIME_PASSWORD}@database:5432/product_studio_release
      APP_ORIGIN: https://localhost:8443
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3100'
      TRUST_PROXY_HOPS: '1'
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  data: {internal: true}
volumes:
  recovery-database:
