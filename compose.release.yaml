name: medi-release-local
x-bounded-logs: &bounded-logs
  driver: local
  options: { max-size: 10m, max-file: '3' }
services:
  database:
    logging: { driver: none }
    command:
      [
        postgres,
        -c,
        log_statement=none,
        -c,
        log_min_error_statement=panic,
        -c,
        log_parameter_max_length=0,
        -c,
        log_parameter_max_length_on_error=0,
        -c,
        log_error_verbosity=terse,
        -c,
        logging_collector=off,
      ]
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_USER: medi_migrator
      POSTGRES_PASSWORD: ${MEDI_MIGRATION_PASSWORD:?Generate private release configuration first}
      POSTGRES_DB: product_studio_release
    volumes:
      - release-database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U medi_migrator -d product_studio_release']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [data]
    restart: unless-stopped
  mfa-keyring:
    logging: *bounded-logs
    image: medi-local-api:${MEDI_RELEASE_TAG:?Missing local release tag}
    user: '0:0'
    command: [node, deploy/keyring-init.mjs]
    volumes: ['./.local/mfa-keyring.json:/input/keyring.json:ro', 'release-mfa-keys:/output']
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
  migrate:
    logging: *bounded-logs
    image: medi-local-api:${MEDI_RELEASE_TAG:?Missing local release tag}
    command: [node, deploy/migrate.mjs]
    volumes: ['release-mfa-keys:/run/secrets:ro']
    environment:
      DATABASE_URL: postgresql://medi_migrator:${MEDI_MIGRATION_PASSWORD}@database:5432/product_studio_release
      MEDI_RUNTIME_PASSWORD: ${MEDI_RUNTIME_PASSWORD:?Missing runtime password}
      STAFF_MFA_KEYRING_FILE: /run/secrets/mfa-keyring.json
    depends_on:
      database: { condition: service_healthy }
      mfa-keyring: { condition: service_completed_successfully }
    networks: [data]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    logging: *bounded-logs
    image: medi-local-api:${MEDI_RELEASE_TAG:?Missing local release tag}
    build: { context: ., target: api }
    volumes: ['release-mfa-keys:/run/secrets:ro']
    environment:
      DATABASE_URL: postgresql://medi_runtime:${MEDI_RUNTIME_PASSWORD}@database:5432/product_studio_release
      APP_ORIGIN: https://localhost:8443
      MEDI_TELEMETRY: private
      NODE_ENV: production
      STAFF_MFA_POLICY: required
      STAFF_MFA_KEYRING_FILE: /run/secrets/mfa-keyring.json
      HOST: 0.0.0.0
      PORT: '3100'
      TRUST_PROXY_HOPS: '1'
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 25s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    logging: *bounded-logs
    image: medi-local-web:${MEDI_RELEASE_TAG:?Missing local release tag}
    build: { context: ., target: web }
    ports: ['127.0.0.1:8443:443']
    volumes:
      - release-certificates:/data
      - release-web-config:/config
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'wget --no-check-certificate --spider -q https://localhost/staff']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  collector-storage:
    image: medi-local-api:${MEDI_RELEASE_TAG:?Missing local release tag}
    user: '0:0'
    command:
      [
        node,
        -e,
        "require('fs').chownSync('/data',10001,10001);require('fs').chmodSync('/data',0o700)",
      ]
    volumes: ['release-telemetry:/data']
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    logging: *bounded-logs
  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      [
        './deploy/observability/collector.yaml:/etc/otelcol/config.yaml:ro',
        'release-telemetry:/data',
      ]
    depends_on:
      collector-storage: { condition: service_completed_successfully }
    networks: [data]
    mem_limit: 128m
    logging: *bounded-logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1@sha256:6927e0919a144aa7616fd0137d4816816d42f6b816de3af269ab065250859a62
    command:
      [
        --config.file=/etc/prometheus/prometheus.yaml,
        --storage.tsdb.retention.time=24h,
        --storage.tsdb.retention.size=128MB,
      ]
    volumes:
      [
        './deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro',
        './deploy/observability/rules.yaml:/etc/prometheus/rules.yaml:ro',
      ]
    tmpfs: ['/prometheus:uid=65534,gid=65534,mode=0700,size=160m']
    networks: [data]
    mem_limit: 256m
    logging: *bounded-logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command: [--config.file=/etc/alertmanager/config.yaml, --cluster.listen-address=]
    volumes: ['./deploy/observability/alertmanager.yaml:/etc/alertmanager/config.yaml:ro']
    tmpfs: ['/alertmanager:uid=65534,gid=65534,mode=0700,size=16m']
    networks: [data]
    mem_limit: 64m
    logging: *bounded-logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  receiver:
    image: medi-local-api:${MEDI_RELEASE_TAG:?Missing local release tag}
    command: [node, /receiver.mjs]
    volumes: ['./deploy/observability/receiver.mjs:/receiver.mjs:ro']
    networks: [data]
    read_only: true
    mem_limit: 64m
    logging: *bounded-logs
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  data: { internal: true }
  edge: {}
volumes:
  release-database:
  release-certificates:
  release-web-config:
  release-mfa-keys:
  release-telemetry:
