name: Medi quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:release-recovery
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:tooling
      - run: npm run db:local
      - run: npm run db:migrate
      - run: npm run typecheck:server
      - run: npm run test:server
      - run: npm run test:operations
      - run: npm run test:operations:tooling
      - run: npm run test:production
      - run: node --test tooling/ci-legacy-fixture.test.mjs
      - run: npm run test:staff
      - run: npm run test:mfa:browser
      - run: npm run test:mfa:artifacts
      - run: node --test tooling/release-local-admission.test.mjs tooling/release-mfa.test.mjs
      - run: npm run db:restore-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tooling-evidence
          path: artifacts/
          retention-days: 7
  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tooling/check.py semgrep
      - run: python3 tooling/check.py trivy
        if: success() || failure()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-security-evidence
          path: artifacts/
          retention-days: 7
  local-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: current
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: current
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bb2d61eca859415e458fc753a5a3787b267fa987
          path: legacy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: current/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: node tooling/ci-legacy-fixture.mjs
      - run: npm run release:local
      - run: npm run production:verify
      - run: npm run test:mfa:runtime
      - run: npm run release:verify
      - run: npm run release:stop
      - run: npm run release:local
      - run: npm run release:verify
      - run: install -d -m 700 .local/release-backups
      - run: npm run release:key-init -- .local/recovery.key
      - run: node tooling/mfa-backup-check.mjs .local/recovery.key
      - run: npm run release:recovery-drill -- .local/recovery.key .local/release-backups/ci.medi
      - run: npm run release:observability
      - run: npm run release:upgrade-check -- .local/ci-old.key .local/release-backups/ci-old.medi
      - run: npm run release:capacity-check -- .local/recovery.key .local/release-backups/ci.medi
      - run: npm run release:preflight -- .local/recovery.key .local/release-backups/ci.medi
      - run: npm run release:stop
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-installation-evidence
          path: current/docs/production-installation-evidence.json
          retention-days: 7
